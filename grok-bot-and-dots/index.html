<title>Grok Bot &amp; OpenAI Dots</title>
<meta name="description" content="Interactive reconstructions of xAI's Grok Bot and OpenAI's Dots, rebuilt from public screenshots.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen app. A slim switcher bar on top; below it each product sits in its own macOS window over the backdrop its maker uses in launch imagery. Under 760px the window drops away and each app switches to its phone layout. */
:root {
  /* shell */
  --sh-bg: #f3f2ef;
  --sh-fg: #18181a;
  --sh-muted: #6c6b68;
  --sh-line: #dfddd8;
  --sh-card: #ffffff;
  --sh-seg: #e7e5e0;
  --sh-seg-on: #ffffff;
  --sh-focus: #3d6df2;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-shell: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* OpenAI Dots (ChatGPT desktop, light) */
  --dt-chrome: #f3f3f3;
  --dt-surface: #ffffff;
  --dt-bubble: #f2f2f2;
  --dt-text: #0d0d0d;
  --dt-text2: #4d4d4d;
  --dt-muted: #8f8f8f;
  --dt-line: #e6e6e6;
  --dt-hover: #ebebeb;
  --dt-pill: #f1f1f1;
  --dt-ink: #0d0d0d;
  --dt-on-ink: #ffffff;
  --dt-unread: #f5b52a;
  --dt-ok: #22a95b;
  --dt-danger: #e5484d;
  --dt-shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 24px rgba(0,0,0,.06);
  --dt-backdrop: #dcecf9;
  --dt-slide-ivory: #f6f3ec;
  --dt-slide-cobalt: #2a49c9;
  --dt-slide-ink: #1d1f2a;
  --dt-cta-bg: #e8ecf7;
  --dt-cta-fg: #3557d4;

  /* xAI Grok Bot (macOS app, light) */
  --gb-side: #f3f3f2;
  --gb-surface: #fbfbfb;
  --gb-panel: #f7f7f6;
  --gb-bubble: #ececec;
  --gb-text: #111111;
  --gb-text2: #4a4a4a;
  --gb-muted: #8b8b8b;
  --gb-line: #e4e4e2;
  --gb-hover: #e8e8e6;
  --gb-sel: #e2e2e0;
  --gb-ink: #111111;
  --gb-on-ink: #ffffff;
  --gb-field: #e9e9e7;
  --gb-card: #ffffff;
  --gb-ok: #2fb36b;
  --gb-warn: #f0a020;
  --gb-backdrop-a: #ff8f92;
  --gb-backdrop-b: #f4606c;
  --gb-shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 28px rgba(0,0,0,.07);

  --mac-red: #ff5f57; --mac-yellow: #febc2e; --mac-green: #28c840;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sh-bg: #141413; --sh-fg: #ecebe8; --sh-muted: #9c9a95; --sh-line: #2c2b29; --sh-card: #1c1c1b; --sh-seg: #262624; --sh-seg-on: #3a3936; --sh-focus: #7fa0ff;
    --dt-chrome: #181818; --dt-surface: #212121; --dt-bubble: #303030; --dt-text: #ececec; --dt-text2: #c4c4c4; --dt-muted: #9b9b9b; --dt-line: #343434; --dt-hover: #2c2c2c; --dt-pill: #2f2f2f; --dt-ink: #ececec; --dt-on-ink: #141414; --dt-unread: #f2b33d; --dt-ok: #3fcf7a; --dt-danger: #ff6b6f; --dt-shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 26px rgba(0,0,0,.35); --dt-backdrop: #0f1a26; --dt-slide-ivory: #f3efe6; --dt-slide-cobalt: #3553d6; --dt-slide-ink: #1d1f2a; --dt-cta-bg: #263150; --dt-cta-fg: #a9bcff;
    --gb-side: #1c1c1d; --gb-surface: #161617; --gb-panel: #1a1a1b; --gb-bubble: #2a2a2c; --gb-text: #f1f1f1; --gb-text2: #c9c9c9; --gb-muted: #8e8e90; --gb-line: #2c2c2e; --gb-hover: #262628; --gb-sel: #2e2e30; --gb-ink: #f1f1f1; --gb-on-ink: #111; --gb-field: #262628; --gb-card: #202022; --gb-ok: #3fcf7a; --gb-warn: #f2b33d; --gb-backdrop-a: #5a2027; --gb-backdrop-b: #2b0f14; --gb-shadow: 0 1px 2px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sh-bg: #141413; --sh-fg: #ecebe8; --sh-muted: #9c9a95; --sh-line: #2c2b29; --sh-card: #1c1c1b; --sh-seg: #262624; --sh-seg-on: #3a3936; --sh-focus: #7fa0ff;
  --dt-chrome: #181818; --dt-surface: #212121; --dt-bubble: #303030; --dt-text: #ececec; --dt-text2: #c4c4c4; --dt-muted: #9b9b9b; --dt-line: #343434; --dt-hover: #2c2c2c; --dt-pill: #2f2f2f; --dt-ink: #ececec; --dt-on-ink: #141414; --dt-unread: #f2b33d; --dt-ok: #3fcf7a; --dt-danger: #ff6b6f; --dt-shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 26px rgba(0,0,0,.35); --dt-backdrop: #0f1a26; --dt-slide-ivory: #f3efe6; --dt-slide-cobalt: #3553d6; --dt-slide-ink: #1d1f2a; --dt-cta-bg: #263150; --dt-cta-fg: #a9bcff;
  --gb-side: #1c1c1d; --gb-surface: #161617; --gb-panel: #1a1a1b; --gb-bubble: #2a2a2c; --gb-text: #f1f1f1; --gb-text2: #c9c9c9; --gb-muted: #8e8e90; --gb-line: #2c2c2e; --gb-hover: #262628; --gb-sel: #2e2e30; --gb-ink: #f1f1f1; --gb-on-ink: #111; --gb-field: #262628; --gb-card: #202022; --gb-ok: #3fcf7a; --gb-warn: #f2b33d; --gb-backdrop-a: #5a2027; --gb-backdrop-b: #2b0f14; --gb-shadow: 0 1px 2px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.4);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--sh-bg); color: var(--sh-fg); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sh-focus); outline-offset: 2px; border-radius: 6px; }
svg { flex: none; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; stroke: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ───────── shell ───────── */
.sh { height: 100%; display: flex; flex-direction: column; }
.sh-bar { flex: none; display: flex; align-items: center; gap: 16px; padding: 10px 18px; border-bottom: 1px solid var(--sh-line); background: var(--sh-bg); position: relative; z-index: 30; }
.sh-brand { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.sh-name { font-family: var(--font-shell); font-weight: 700; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.sh-sub { font-family: var(--font-mono); font-size: 10.5px; color: var(--sh-muted); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-seg { margin-left: auto; display: flex; padding: 3px; gap: 2px; background: var(--sh-seg); border-radius: 11px; }
.sh-seg button { display: flex; align-items: center; gap: 7px; padding: 6px 12px 6px 8px; border-radius: 8px; font-family: var(--font-shell); font-weight: 600; font-size: 13px; color: var(--sh-muted); white-space: nowrap; }
.sh-seg button[aria-selected="true"] { background: var(--sh-seg-on); color: var(--sh-fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.sh-seg .mark { width: 20px; height: 20px; display: grid; place-items: center; }
.sh-tools { display: flex; gap: 6px; }
.sh-btn { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--sh-line); font-family: var(--font-shell); font-weight: 600; font-size: 12.5px; background: var(--sh-card); white-space: nowrap; }
.sh-btn:hover { border-color: var(--sh-muted); }
.sh-btn .ic { width: 15px; height: 15px; }
.sh-stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.sh-app { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 22px 26px; }
.sh-app[hidden] { display: none !important; }

/* backdrops echo the launch imagery: soft sky for Dots, coral for Grok Bot */
.sh-app.is-dots { background: radial-gradient(120% 90% at 10% 0%, color-mix(in srgb, var(--dt-accent) 22%, var(--dt-backdrop)) 0%, var(--dt-backdrop) 55%, color-mix(in srgb, var(--dt-backdrop) 85%, var(--sh-bg)) 100%); }
.sh-app.is-grok { background: radial-gradient(110% 100% at 30% 10%, var(--gb-backdrop-a) 0%, var(--gb-backdrop-b) 100%); }

/* toast */
.toast { position: absolute; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 80; background: #161616; color: #fff; padding: 9px 14px; border-radius: 12px; font-size: 13px; max-width: min(460px, calc(100% - 32px)); box-shadow: 0 8px 30px rgba(0,0,0,.25); transition: opacity .2s, transform .2s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* field notes drawer */
.notes { position: absolute; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--sh-card); border-left: 1px solid var(--sh-line); z-index: 60; display: flex; flex-direction: column; box-shadow: -20px 0 50px rgba(0,0,0,.12); transform: translateX(102%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
.notes.on { transform: none; }
.notes-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--sh-line); }
.notes-head h2 { font-family: var(--font-shell); font-size: 16px; margin: 0; flex: 1; }
.notes-body { overflow: auto; padding: 4px 20px 32px; font-size: 13.5px; line-height: 1.55; }
.notes-body h3 { font-family: var(--font-shell); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--sh-muted); margin: 22px 0 8px; }
.notes-body p { margin: 0 0 10px; max-width: 62ch; }
.notes-body ul { margin: 0 0 10px; padding-left: 18px; }
.notes-body li { margin: 3px 0; }
.notes-body a { color: var(--sh-focus); text-underline-offset: 2px; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 6px 0 4px; font-size: 13px; }
.facts dt { font-family: var(--font-mono); font-size: 11px; color: var(--sh-muted); padding-top: 2px; text-transform: uppercase; letter-spacing: .04em; }
.facts dd { margin: 0; }
.src { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.src li { border: 1px solid var(--sh-line); border-radius: 10px; padding: 9px 11px; margin: 0; }
.src b { font-weight: 600; }
.src span { display: block; color: var(--sh-muted); font-size: 12.5px; }
.tag { display: inline-block; font-family: var(--font-mono); font-size: 10px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--sh-line); color: var(--sh-muted); margin-left: 6px; vertical-align: 1px; }
.tag.ok { color: #1d8a4c; border-color: color-mix(in srgb, #1d8a4c 40%, transparent); }
.tag.inf { color: #b26a00; border-color: color-mix(in srgb, #b26a00 40%, transparent); }

/* ───────── macOS window frame (shared) ───────── */
.mac { width: 100%; height: 100%; max-width: 1440px; max-height: 900px; border-radius: 13px; overflow: hidden; position: relative; display: flex; box-shadow: 0 0 0 .5px rgba(0,0,0,.28), 0 24px 70px rgba(0,0,0,.22), 0 4px 14px rgba(0,0,0,.08); }
.lights { display: flex; gap: 8px; padding-left: 2px; flex: none; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: var(--mac-red); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
.lights i:nth-child(2) { background: var(--mac-yellow); }
.lights i:nth-child(3) { background: var(--mac-green); }

/* ═════════ OpenAI Dots ═════════ */
.dt { --dt-accent: #4878fe; --dt-accent-hi: #6d94fe; --dt-accent-lo: #385dc6; --dt-on-accent: #ffffff; font-size: 14.5px; color: var(--dt-text); background: var(--dt-chrome); }
.dt .ic { width: 18px; height: 18px; }
.dt-left { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.dt-tb { height: 40px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 10px 0 14px; color: var(--dt-muted); }
.dt-tb .lights { margin-right: 14px; }
.dt-tbtn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; color: var(--dt-muted); }
.dt-tbtn:hover { background: var(--dt-hover); color: var(--dt-text); }
.dt-tbtn[aria-pressed="true"] { background: var(--dt-hover); color: var(--dt-text); }
.dt-tbtn[disabled] { opacity: .45; pointer-events: none; }
.dt-tb .grow { flex: 1; }
.dt-body { flex: 1; min-height: 0; display: flex; }
.dt-rail { width: 52px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 0 14px; }
.dt-rbtn { position: relative; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; color: var(--dt-text2); }
.dt-rbtn:hover { background: var(--dt-hover); }
.dt-rbtn[aria-current="page"] { background: var(--dt-hover); color: var(--dt-text); }
.dt-rbtn .ic { width: 19px; height: 19px; }
.dt-rbtn .badge { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--dt-unread); box-shadow: 0 0 0 2px var(--dt-chrome); }
.dt-rail hr { width: 22px; border: 0; border-top: 1px solid var(--dt-line); margin: 4px 0; }
.dt-rail .me { margin-top: auto; width: 26px; height: 26px; border-radius: 50%; background: #2f6fde; color: #fff; font-size: 10px; font-weight: 600; display: grid; place-items: center; letter-spacing: .02em; }
.dt-tip { position: relative; }
.dt-tip[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%); background: #111; color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; z-index: 20; pointer-events: none; }
.dt-main { flex: 1; min-width: 0; background: var(--dt-surface); border-top-left-radius: 11px; position: relative; display: flex; box-shadow: inset 1px 1px 0 var(--dt-line); }
.dt-chat { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; }

/* floating dot at the top of the thread */
.dt-head { position: absolute; top: 0; left: 0; right: var(--card-w, 0px); height: 124px; z-index: 4; pointer-events: none; display: flex; justify-content: center; background: linear-gradient(var(--dt-surface) 62%, color-mix(in srgb, var(--dt-surface) 0%, transparent)); }
.dt-head-in { pointer-events: auto; display: flex; flex-direction: column; align-items: center; padding-top: 8px; }
.dt-head-av { position: relative; width: 60px; height: 60px; display: grid; place-items: center; border-radius: 50%; }
.dt-head-av::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; background: radial-gradient(closest-side, var(--dt-surface) 55%, transparent); }
.dt-head-av > * { position: relative; }
.dt-head-av.busy { animation: dt-bob 1.1s ease-in-out infinite; }
@keyframes dt-bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) rotate(-3deg) } }
.dt-namepill { margin-top: -9px; position: relative; display: flex; flex-direction: column; align-items: center; background: var(--dt-surface); color: var(--dt-text); padding: 3px 12px 4px; border-radius: 12px; box-shadow: 0 0 0 1px var(--dt-line), 0 2px 8px rgba(0,0,0,.07); max-width: 280px; }
.dt-namepill b { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.dt-namepill span { font-size: 12px; color: var(--dt-muted); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.dt-namepill span.thinking { animation: dt-shimmer 1.4s linear infinite; }
.dt-bulb { position: absolute; right: -14px; top: -2px; font-size: 16px; animation: dt-bob 1.2s ease-in-out infinite; }
.dt-status { font-size: 11.5px; color: var(--dt-muted); margin-top: 3px; min-height: 14px; }
.dt-status.thinking { animation: dt-shimmer 1.4s linear infinite; }
@keyframes dt-shimmer { 50% { opacity: .45 } }
.dt-acts { position: absolute; top: 10px; right: calc(12px + var(--card-w, 0px)); z-index: 5; display: flex; gap: 2px; }
.dt-main.with-card { --card-w: 316px; }
@media (max-width: 1080px) { .dt-main.with-card { --card-w: 0px; } }
.dt-acts { gap: 10px !important; top: 14px !important; }
.dt-acts .dt-tbtn { width: 36px; height: 36px; border-radius: 50%; background: var(--dt-surface); box-shadow: 0 0 0 1px var(--dt-line), 0 1px 3px rgba(0,0,0,.05); color: var(--dt-text); }
.dt-acts .dt-tbtn:hover { background: var(--dt-pill); }

.dt-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 118px var(--card-w, 0px) 8px 0; scroll-behavior: smooth; }
.dt-col { max-width: 700px; margin: 0 auto; padding: 0 28px; display: flex; flex-direction: column; gap: 6px; }
.dt-time { align-self: center; font-size: 11.5px; color: var(--dt-muted); margin: 12px 0 6px; font-weight: 500; }
.dt-time b { color: var(--dt-text2); font-weight: 600; }
.dt-row { display: flex; align-items: flex-end; gap: 6px; max-width: 100%; position: relative; }
.dt-row.me { justify-content: flex-end; }
.dt-row.me + .dt-row:not(.me), .dt-row:not(.me) + .dt-row.me { margin-top: 8px; }
.dt-bub { background: var(--dt-bubble); padding: 9px 14px; border-radius: 19px; line-height: 1.45; max-width: min(78%, 560px); overflow-wrap: anywhere; }
.dt-bub p { margin: 0; }
.dt-bub p + p, .dt-bub p + ul, .dt-bub ul + p { margin-top: 9px; }
.dt-bub ul { margin: 6px 0 0; padding-left: 20px; }
.dt-bub a { color: inherit; text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
.dt-row.me .dt-bub { background: linear-gradient(180deg, var(--dt-accent-hi), var(--dt-accent) 70%); color: var(--dt-on-accent); }
.dt-hover { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; align-self: center; color: var(--dt-muted); }
.dt-row:hover .dt-hover { opacity: 1; }
.dt-hover button { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; }
.dt-hover button:hover { background: var(--dt-hover); color: var(--dt-text); }
.dt-hover .ic { width: 15px; height: 15px; }
.dt-bub { position: relative; }
.dt-react { position: absolute; top: -11px; left: -11px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; background: var(--dt-surface); box-shadow: 0 1px 4px rgba(0,0,0,.16); }
.dt-row:not(.me) .dt-react { top: auto; left: auto; bottom: -10px; right: -8px; }
.dt-row.me.has-react { margin-top: 12px; }
.dt-row:not(.me).has-react { margin-bottom: 10px; }
.dt-read { align-self: flex-end; font-size: 11px; color: var(--dt-muted); margin: -2px 6px 2px 0; }
.dt-quote { display: flex; align-items: center; gap: 6px; color: var(--dt-muted); font-size: 12.5px; margin: 8px 0 -2px 2px; max-width: 78%; min-width: 0; }
.dt-quote span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dt-quote .ic { width: 14px; height: 14px; }
.dt-chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; padding: 6px 8px 6px 9px; border: 1px solid var(--dt-line); border-radius: 10px; background: var(--dt-surface); font-size: 13.5px; max-width: 78%; }
.dt-chip:hover { background: var(--dt-pill); }
.dt-chip .ic { width: 16px; height: 16px; }
.dt-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dt-count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--dt-unread) 18%, transparent); color: color-mix(in srgb, var(--dt-unread) 70%, var(--dt-text)); font-variant-numeric: tabular-nums; }
.dt-chip.working .dt-count { background: var(--dt-pill); color: var(--dt-muted); }
.dt-spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--dt-muted) 35%, transparent); border-top-color: var(--dt-muted); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }
.dt-replies { align-self: flex-start; font-size: 12.5px; color: var(--dt-muted); padding: 2px 4px; margin-top: -2px; }
.dt-replies:hover { color: var(--dt-text); text-decoration: underline; }

@keyframes dt-dot { 0%,60%,100% { opacity: .3; transform: none } 30% { opacity: 1; transform: translateY(-2px) } }

/* slide preview card (from the launch image) */

.slide-img { background: radial-gradient(60% 70% at 40% 60%, var(--dt-slide-cobalt), color-mix(in srgb, var(--dt-slide-cobalt) 70%, #000)); position: relative; overflow: hidden; }
.slide-leaf { position: absolute; right: -4%; top: -6%; width: 46%; height: auto; opacity: .95; }
.slide-phone { position: absolute; left: 22%; top: 16%; width: 44%; height: 96%; background: #fff; border-radius: 4.4cqw; border: 1.1cqw solid #111; padding: 4cqw 3cqw; display: flex; flex-direction: column; gap: 1.4cqw; font-size: 2.6cqw; color: #222; }

.slide-phone .ring { width: 13cqw; height: 13cqw; border-radius: 50%; border: 1cqw solid var(--dt-slide-cobalt); display: grid; place-items: center; font-weight: 600; font-size: 3.4cqw; margin-top: 2cqw; }
.slide.b .slide-h { font-weight: 600; }

/* composer */
.dt-compose { flex: none; padding: 10px calc(28px + var(--card-w, 0px)) 18px 28px; }
.dt-compose form { max-width: 644px; margin: 0 auto; display: flex; align-items: center; gap: 8px; border: 1px solid var(--dt-line); background: var(--dt-surface); border-radius: 26px; padding: 6px 7px 6px 10px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
.dt-compose input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14.5px; padding: 6px 2px; }
.dt-compose input::placeholder { color: var(--dt-muted); }
.dt-compose .dt-tbtn { color: var(--dt-text2); }
.dt-send { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--dt-accent); color: var(--dt-on-accent); transition: opacity .15s; }

.dt-suggest { max-width: 644px; margin: 0 auto 8px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; mask-image: linear-gradient(90deg, #000 85%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); }

/* right card */
.dt-card { position: absolute; top: 12px; right: 12px; bottom: 12px; width: 296px; z-index: 6; display: flex; flex-direction: column; }
.dt-card-in { max-height: 100%; overflow: auto; background: var(--dt-surface); border: 1px solid var(--dt-line); border-radius: 18px; box-shadow: var(--dt-shadow); padding: 16px 14px 14px; scrollbar-width: thin; }
.dt-card-top { display: flex; align-items: center; gap: 12px; padding: 0 2px; }

.dt-edit { position: absolute; right: -4px; bottom: -2px; width: 24px; height: 24px; border-radius: 50%; background: var(--dt-surface); box-shadow: 0 1px 4px rgba(0,0,0,.18); display: grid; place-items: center; color: var(--dt-text); }
.dt-edit .ic { width: 13px; height: 13px; }
.dt-card-name { font-weight: 600; font-size: 17px; }
.dt-card-st { color: var(--dt-muted); font-size: 14px; display: flex; align-items: center; gap: 6px; }
.dt-card-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0 6px; }
.dt-pillbtn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 38px; border-radius: 11px; background: var(--dt-pill); font-size: 14.5px; }
.dt-pillbtn:hover { background: var(--dt-hover); }
.dt-sec { color: var(--dt-muted); font-size: 13.5px; margin: 16px 2px 6px; display: flex; justify-content: space-between; align-items: center; }
.dt-comp { display: flex; align-items: center; gap: 10px; padding: 6px 2px; }
.dt-comp > .ic { color: var(--dt-text2); width: 18px; height: 18px; }
.dt-comp .ico { position: relative; display: grid; }
.dt-comp .ico .on { position: absolute; right: -2px; bottom: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--dt-ok); box-shadow: 0 0 0 2px var(--dt-surface); }
.dt-comp .txt { flex: 1; min-width: 0; line-height: 1.3; }
.dt-comp .txt b { font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.dt-comp .txt span { color: var(--dt-muted); font-size: 13px; }
.dt-thumb { width: 58px; height: 36px; border-radius: 7px; background: linear-gradient(160deg, var(--dt-accent-hi), var(--dt-accent-lo)); padding: 3px; box-shadow: 0 0 0 1px var(--dt-line); position: relative; }
.dt-thumb::after { content: ""; position: absolute; inset: 4px 5px 7px; border-radius: 2px; background: color-mix(in srgb, var(--dt-accent) 10%, #fff); }
.dt-allow { height: 30px; padding: 0 14px; border-radius: 999px; background: var(--dt-ink); color: var(--dt-on-ink); font-size: 13.5px; font-weight: 500; }
.dt-act { display: flex; align-items: center; gap: 10px; width: 100%; padding: 5px 4px 5px 2px; border-radius: 8px; text-align: left; font-size: 14px; }

.dt-act .dt-spin { width: 12px; height: 12px; }
.dt-more { display: flex; align-items: center; gap: 8px; color: var(--dt-muted); font-size: 14px; padding: 4px 2px; }
.dt-more .ic { width: 15px; height: 15px; }
.dt-out { display: flex; align-items: center; gap: 10px; padding: 5px 2px; font-size: 13.5px; width: 100%; text-align: left; border-radius: 8px; }
.dt-out:hover { background: var(--dt-pill); }
.dt-out .fi { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: var(--dt-pill); color: var(--dt-text2); flex: none; }
.dt-out .fi .ic { width: 15px; height: 15px; }
.dt-out span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dt-out small { color: var(--dt-muted); font-size: 12px; }

/* right pane: tabs + computer / doc */
.dt-right { width: 52%; flex: none; display: flex; flex-direction: column; min-width: 0; }
.dt-right[hidden] { display: none; }
.dt-tabs { height: 40px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 10px 0 4px; color: var(--dt-muted); }
.dt-tab { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 8px 0 10px; border-radius: 9px; font-size: 13px; color: var(--dt-text2); max-width: 230px; min-width: 0; }
.dt-tab[aria-selected="true"] { background: var(--dt-surface); color: var(--dt-text); box-shadow: 0 0 0 .5px var(--dt-line), 0 1px 2px rgba(0,0,0,.05); }
.dt-tab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dt-tab .ic { width: 15px; height: 15px; }
.dt-tab .x { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; color: var(--dt-muted); }
.dt-tab .x:hover { background: var(--dt-hover); }
.dt-tab .x .ic { width: 13px; height: 13px; }
.dt-tabs .grow { flex: 1; }
.dt-pane { flex: 1; min-height: 0; background: var(--dt-surface); border-top-left-radius: 11px; box-shadow: inset 1px 1px 0 var(--dt-line); display: flex; flex-direction: column; position: relative; overflow: hidden; }

.dt-vmwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 18px; container-type: size; }
.dt-vm { width: min(100%, 760px, calc((100cqh - 64px) * 1.538)); min-width: 0; flex: none; aspect-ratio: 16 / 10.4; border-radius: 22px; background: linear-gradient(165deg, var(--dt-accent-hi), var(--dt-accent) 55%, var(--dt-accent-lo)); padding: 4.2% 5.5% 0; display: flex; flex-direction: column; align-items: center; container-type: inline-size; position: relative; }
.vm-win { width: 100%; flex: 1; min-height: 0; background: color-mix(in srgb, var(--dt-accent) 9%, #fff); border-radius: 6px 6px 0 0; overflow: hidden; display: flex; flex-direction: column; color: #1d2b29; box-shadow: 0 0 0 1px color-mix(in srgb, var(--dt-accent-lo) 40%, transparent); }
.vm-tabs { display: flex; align-items: center; gap: 1.2cqw; height: 4.4cqw; padding: 0 1cqw; background: color-mix(in srgb, var(--dt-accent) 45%, #fff); font-size: 1.5cqw; }
.vm-tab { display: flex; align-items: center; gap: .8cqw; height: 3.6cqw; margin-top: .8cqw; padding: 0 1cqw; width: 26%; border-radius: .9cqw .9cqw 0 0; background: color-mix(in srgb, var(--dt-accent) 22%, #fff); }
.vm-tab span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vm-tabs .ctl { margin-left: auto; letter-spacing: 1.6cqw; opacity: .7; }
.vm-bar { display: flex; align-items: center; gap: 1.4cqw; height: 4.6cqw; padding: 0 1.4cqw; background: color-mix(in srgb, var(--dt-accent) 22%, #fff); font-size: 1.6cqw; }
.vm-url { flex: 1; height: 3.2cqw; border-radius: 99px; background: #fff; border: .2cqw solid color-mix(in srgb, var(--dt-accent-lo) 70%, #000); display: flex; align-items: center; gap: .8cqw; padding: 0 1cqw; font-size: 1.5cqw; color: #234; white-space: nowrap; overflow: hidden; }
.vm-url .caret { width: .15cqw; height: 1.8cqw; background: #222; animation: dt-shimmer 1s steps(1) infinite; }
.vm-page { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding-top: 4cqw; }
.vm-doodles { position: absolute; inset: 0; color: color-mix(in srgb, var(--dt-accent-lo) 45%, #fff); opacity: .55; }
.vm-bubble { position: relative; background: #fff; border-radius: 1.6cqw; padding: 1.2cqw 1.6cqw; font-size: 1.45cqw; line-height: 1.45; max-width: 26cqw; box-shadow: 0 .3cqw 1.2cqw rgba(0,0,0,.08); color: #333; }
.vm-bubble::after { content: ""; position: absolute; right: 22%; bottom: -1cqw; border: 1cqw solid transparent; border-top-color: #fff; border-bottom: 0; }
.vm-av { margin-top: .6cqw; }
.vm-clock { font-size: 8cqw; font-weight: 500; letter-spacing: -.04em; color: color-mix(in srgb, var(--dt-accent-lo) 45%, #0b2a26); line-height: 1; margin-top: .4cqw; font-variant-numeric: tabular-nums; }
.vm-clock small { font-size: 1.4cqw; letter-spacing: 0; margin-left: .6cqw; }
.vm-hello { font-size: 2.6cqw; margin-top: 1.6cqw; color: color-mix(in srgb, var(--dt-accent-lo) 45%, #0b2a26); }
.vm-apps { display: grid; grid-template-columns: repeat(5, 8cqw); gap: 2.2cqw 2.6cqw; margin-top: 3cqw; position: relative; }
.vm-app { display: flex; flex-direction: column; align-items: center; gap: .9cqw; font-size: 1.45cqw; color: #2c4a46; }
.vm-app b { width: 5cqw; height: 5cqw; border-radius: 1.2cqw; background: #fff; display: grid; place-items: center; box-shadow: 0 .2cqw .6cqw rgba(0,0,0,.08); font-size: 2cqw; font-weight: 700; }
.vm-dock { display: flex; gap: 1.2cqw; padding: 1cqw 1.4cqw; margin: 1.2cqw 0; border-radius: 1.6cqw; background: rgba(255,255,255,.22); box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
.vm-dock b { width: 4.4cqw; height: 4.4cqw; border-radius: 1.1cqw; display: grid; place-items: center; }
.vm-doc { position: relative; width: 70%; flex: 1; background: #fff; border-radius: 1cqw 1cqw 0 0; padding: 3cqw; display: flex; flex-direction: column; gap: 1.2cqw; box-shadow: 0 .4cqw 2cqw rgba(0,0,0,.08); }
.vm-doc .h { height: 2.4cqw; width: 56%; border-radius: .6cqw; background: #1f2b29; opacity: .85; }
.vm-doc .l { height: 1.2cqw; border-radius: .6cqw; background: #dfe7e5; }
.vm-doc .l.typing { background: linear-gradient(90deg, #c9d6d3 50%, #eef3f2 50%) 100% 0 / 200% 100%; animation: vm-type 2.2s linear infinite; }
@keyframes vm-type { to { background-position: 0 0 } }
.vm-cursor { position: absolute; width: 2.4cqw; height: 2.4cqw; z-index: 3; left: 30%; top: 40%; filter: drop-shadow(0 .2cqw .3cqw rgba(0,0,0,.3)); animation: vm-move 5s ease-in-out infinite; }
@keyframes vm-move { 0% { left: 30%; top: 40% } 25% { left: 62%; top: 30% } 50% { left: 55%; top: 66% } 75% { left: 36%; top: 58% } 100% { left: 30%; top: 40% } }
.dt-ctl { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border-radius: 999px; background: var(--dt-surface); box-shadow: 0 0 0 1px var(--dt-line), 0 4px 16px rgba(0,0,0,.06); font-size: 13.5px; }
.dt-ctl button { height: 28px; padding: 0 12px; border-radius: 999px; background: var(--dt-ink); color: var(--dt-on-ink); font-size: 13px; font-weight: 500; }

/* doc tab: slide editor seen in the launch image */
.doc-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--dt-line); color: var(--dt-muted); }
.doc-url { flex: 1; text-align: center; font-size: 13px; color: var(--dt-text2); background: var(--dt-pill); border-radius: 999px; padding: 5px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-body { flex: 1; min-height: 0; display: flex; background: color-mix(in srgb, var(--dt-surface) 92%, var(--dt-text)); }

.doc-ruler { height: 16px; flex: none; border-bottom: 1px solid var(--dt-line); display: flex; justify-content: space-between; font-size: 9px; color: var(--dt-muted); font-family: var(--font-mono); padding: 0 6px; }
.doc-slide { background: var(--dt-slide-ivory); color: var(--dt-slide-ink); border-radius: 4px; box-shadow: 0 1px 6px rgba(0,0,0,.12); padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 10px; container-type: inline-size; margin-top: 30px; }

.doc-vars { display: grid; grid-template-columns: 1fr 1fr; gap: 3cqw; }

.doc-var small { display: block; font-size: 1.6cqw; letter-spacing: .08em; color: var(--dt-slide-cobalt); font-weight: 600; margin-bottom: 1.4cqw; }

.doc-var p { margin: 0 0 2.4cqw; font-size: 1.5cqw; line-height: 1.45; opacity: .8; }
.doc-var .cta { display: inline-block; background: var(--dt-slide-cobalt); color: #fff; font-size: 1.4cqw; padding: .9cqw 2cqw; border-radius: .4cqw; }
.doc-var .ph { border-radius: .8cqw; background: radial-gradient(70% 60% at 40% 65%, var(--dt-slide-cobalt), color-mix(in srgb, var(--dt-slide-cobalt) 60%, #000)); position: relative; min-height: 18cqw; }
.doc-var .ph::after { content: ""; position: absolute; left: 22%; top: 12%; width: 40%; height: 82%; background: #fff; border: .6cqw solid #111; border-radius: 2.4cqw; }
.doc-var.sel { outline: 2px solid var(--dt-accent); outline-offset: 6px; border-radius: 2px; }
.doc-tools { width: 64px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; border-left: 1px solid var(--dt-line); color: var(--dt-text2); font-size: 9.5px; }
.doc-tools div { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.doc-tools .ic { width: 15px; height: 15px; }

/* placeholder views for rail items */
.dt-view { flex: 1; min-height: 0; overflow: auto; padding: 32px 36px; }
.dt-view h2 { font-size: 22px; font-weight: 600; margin: 0 0 4px; letter-spacing: -.01em; }
.dt-view > p { color: var(--dt-muted); margin: 0 0 18px; }
.dt-sched { display: grid; gap: 8px; max-width: 640px; }
.dt-sched-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--dt-line); border-radius: 14px; }
.dt-sched-row .ic { color: var(--dt-text2); }
.dt-sched-row div { flex: 1; min-width: 0; }
.dt-sched-row b { display: block; font-weight: 500; }
.dt-sched-row span { color: var(--dt-muted); font-size: 13px; }
.dt-toggle { width: 34px; height: 20px; border-radius: 99px; background: var(--dt-line); position: relative; flex: none; transition: background .15s; }
.dt-toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
.dt-toggle[aria-checked="true"] { background: var(--dt-accent); }
.dt-toggle[aria-checked="true"]::after { transform: translateX(14px); }
.dt-lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; max-width: 820px; }
.dt-lib button { text-align: left; border: 1px solid var(--dt-line); border-radius: 14px; overflow: hidden; background: var(--dt-surface); }
.dt-lib .pv { height: 96px; background: var(--dt-pill); display: grid; place-items: center; color: var(--dt-muted); }
.dt-lib .pv .ic { width: 26px; height: 26px; }
.dt-lib .mt { padding: 9px 11px; font-size: 13px; }
.dt-lib .mt small { display: block; color: var(--dt-muted); font-size: 12px; margin-top: 2px; }

/* thread view header */
.dt-thead { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--dt-surface); border-bottom: 1px solid var(--dt-line); }
.dt-thead b { font-weight: 600; }
.dt-thead span { color: var(--dt-muted); font-size: 13px; }
.dt-thead .dt-tbtn { width: 30px; height: 30px; }

/* modal: customize your dot */
.dt-modal { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(0,0,0,.22); padding: 20px; animation: fadein .15s; }
@keyframes fadein { from { opacity: 0 } }
.dt-cust { width: min(860px, 100%); max-height: 100%; background: var(--dt-surface); border-radius: 22px; overflow: hidden; display: grid; grid-template-columns: 1fr 340px; box-shadow: 0 30px 80px rgba(0,0,0,.3); }
.dt-cust-l { padding: 26px 28px 24px; min-width: 0; overflow: auto; }
.dt-cust-l h2 { margin: 0 0 14px; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.dt-cust-sec { display: flex; align-items: center; justify-content: space-between; color: var(--dt-text2); font-size: 15px; margin: 14px 0 10px; }
.dt-cust-sec .nav { display: flex; gap: 10px; color: var(--dt-muted); }
.dt-cust-sec .nav button { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; }
.dt-cust-sec .nav button:hover { background: var(--dt-pill); color: var(--dt-text); }
.dt-cust-sec .nav .ic { width: 14px; height: 14px; }
.dt-strip { display: flex; gap: 14px; overflow-x: auto; scroll-behavior: smooth; padding: 4px 2px 6px; scrollbar-width: none; }
.dt-strip::-webkit-scrollbar { display: none; }
.dt-swatch { width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; position: relative; }

.gb-bub p + p, .gb-bub p + ul, .gb-bub ul + p { margin-top: 8px; }
.gb-bub ul { margin: 4px 0 0; padding-left: 18px; }
.gb-bub a { color: #1a7fff; text-decoration: none; }
.gb-bub code { font-family: var(--font-mono); font-size: 12.5px; color: #d6334a; background: color-mix(in srgb, #d6334a 9%, transparent); padding: 1px 4px; border-radius: 4px; }
.gb-me { align-self: flex-end; background: var(--gb-ink); color: var(--gb-on-ink); }
.gb-me + .gb-bub:not(.gb-me), .gb-bub:not(.gb-me) + .gb-me { margin-top: 6px; }
.gb-react { position: absolute; left: 8px; bottom: -12px; font-size: 12px; background: var(--gb-card); border-radius: 999px; padding: 0 5px; box-shadow: 0 0 0 1px var(--gb-line); }
.gb-has-react { margin-bottom: 10px; }
.gb-time { align-self: center; font-size: 12px; color: var(--gb-muted); margin: 12px 0 4px; }
.gb-sys { align-self: center; font-size: 12px; color: var(--gb-muted); margin: 4px 0; }
.gb-typing { align-self: flex-start; display: inline-flex; gap: 4px; padding: 13px 14px; background: var(--gb-bubble); border-radius: 18px; }
.gb-typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--gb-muted); animation: dt-dot 1s infinite; }
.gb-typing i:nth-child(2) { animation-delay: .15s } .gb-typing i:nth-child(3) { animation-delay: .3s }
.gb-shot { align-self: flex-start; width: min(330px, 78%); border-radius: 12px; overflow: hidden; background: #d9dadd; box-shadow: 0 0 0 1px var(--gb-line); cursor: zoom-in; display: flex; flex-direction: column; }
.gb-shot .mk { aspect-ratio: 16 / 9.4; }
.gb-shot .dock { height: 14px; display: flex; justify-content: center; align-items: center; gap: 4px; background: #c8c9cc; }
.gb-shot .dock i { width: 8px; height: 8px; border-radius: 2.5px; background: #fff; }
.gb-shot .dock i:nth-child(2) { background: #8a8a8a; } .gb-shot .dock i:nth-child(3) { background: #333; }
.gb-choice { align-self: flex-start; background: var(--gb-bubble); border-radius: 18px; padding: 10px 10px 10px; max-width: 82%; width: min(560px, 82%); display: flex; flex-direction: column; gap: 9px; }
.gb-choice .q { padding: 0 4px; line-height: 1.45; display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; }
.gb-choice .q small { display: block; color: var(--gb-muted); font-size: 12.5px; margin-top: 2px; }
.gb-opts { background: var(--gb-card); border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--gb-line); }
.gb-opt { display: flex; align-items: center; gap: 10px; padding: 9px 10px; width: 100%; text-align: left; font-size: 13.5px; }
.gb-opt + .gb-opt { border-top: 1px solid var(--gb-line); }
.gb-opt:hover { background: var(--gb-hover); }
.gb-opt kbd { width: 20px; height: 20px; border-radius: 5px; background: var(--gb-field); font: 500 11px var(--font-ui); display: grid; place-items: center; color: var(--gb-muted); flex: none; }
.gb-picked { display: flex; align-items: center; gap: 10px; background: var(--gb-card); border-radius: 11px; padding: 8px 10px; color: var(--gb-muted); font-size: 13.5px; box-shadow: 0 0 0 1px var(--gb-line); }
.gb-picked span { flex: 1; }
.gb-picked .ic { width: 15px; height: 15px; }
.gb-task { align-self: flex-start; width: min(460px, 82%); background: var(--gb-bubble); border-radius: 16px; padding: 11px 12px; display: flex; flex-direction: column; gap: 10px; }
.gb-task .r1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 500; }
.gb-task .r1 span:first-child { min-width: 0; overflow-wrap: anywhere; }
.gb-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: #1a7fff; font-weight: 500; flex: none; }
.gb-status.done { color: var(--gb-ok); }
.gb-spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid color-mix(in srgb, currentColor 30%, transparent); border-top-color: currentColor; animation: spin .8s linear infinite; display: inline-block; flex: none; }
.gb-task .open { align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 9px; border-radius: 9px; background: var(--gb-card); box-shadow: 0 0 0 1px var(--gb-line); font-size: 13px; }
.gb-task .open:hover { background: var(--gb-hover); }
.gb-approve { align-self: flex-start; width: min(420px, 82%); background: var(--gb-bubble); border-radius: 16px; padding: 11px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.gb-approve .lab { font-weight: 500; font-size: 13.5px; display: flex; justify-content: space-between; }
.gb-approve .lab span { color: var(--gb-muted); font-weight: 400; }
.gb-approve .draft { background: var(--gb-card); border-radius: 10px; padding: 11px 12px; line-height: 1.5; font-size: 13.5px; white-space: pre-line; }
.gb-approve .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gb-approve .btns button { height: 36px; border-radius: 10px; font-weight: 500; font-size: 13.5px; background: var(--gb-card); box-shadow: 0 0 0 1px var(--gb-line); }
.gb-approve .btns .yes { background: var(--gb-ink); color: var(--gb-on-ink); box-shadow: none; }
.gb-approve .res { display: flex; align-items: center; gap: 7px; color: var(--gb-muted); font-size: 13px; }
.gb-approve .res .ic { width: 15px; height: 15px; color: var(--gb-ok); }
.gb-file { align-self: flex-start; display: flex; align-items: center; gap: 10px; background: var(--gb-bubble); border-radius: 14px; padding: 9px 14px 9px 10px; min-width: 220px; max-width: 82%; position: relative; text-align: left; }
.gb-file .fi { width: 22px; height: 26px; border-radius: 4px; background: #f4b400; position: relative; flex: none; }
.gb-file .fi::after { content: ""; position: absolute; inset: 8px 5px 8px; background: #fff; border-radius: 1px; }
.gb-file b { font-weight: 500; display: block; }
.gb-file small { color: var(--gb-muted); font-size: 12.5px; }

.gb-compose { flex: none; padding: 8px 24px 16px; }
.gb-compose form { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 8px; background: var(--gb-card); border-radius: 24px; padding: 6px 6px 6px 8px; box-shadow: 0 0 0 1px var(--gb-line), 0 2px 8px rgba(0,0,0,.04); }
.gb-compose input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px; padding: 6px 2px; }
.gb-compose input::placeholder { color: var(--gb-muted); }
.gb-plus { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--gb-muted); box-shadow: inset 0 0 0 1.5px var(--gb-line); }
.gb-plus .ic { width: 15px; height: 15px; }
.gb-mic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--gb-ink); color: var(--gb-on-ink); flex: none; }
.gb-mic .ic { width: 16px; height: 16px; }

.gb-panel { width: 316px; flex: none; background: var(--gb-panel); border-left: 1px solid var(--gb-line); display: flex; flex-direction: column; min-height: 0; }
.gb-panel[hidden] { display: none; }
.gb-ptop { height: 44px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 10px; }
.gb-ptop .ttl { flex: 1; text-align: center; font-weight: 600; font-size: 14px; }
.gb-ptop .sp { flex: 1; }
.gb-pbody { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 14px 18px; }
.gb-screen { width: 100%; aspect-ratio: 16 / 10; border-radius: 10px; background: var(--gb-field); display: grid; place-items: center; overflow: hidden; color: var(--gb-muted); position: relative; box-shadow: 0 0 0 1px var(--gb-line); }
.gb-screen .mk { position: absolute; inset: 0; }
.gb-screen .live { position: absolute; left: 7px; top: 7px; display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; color: #fff; background: rgba(0,0,0,.55); padding: 2px 7px 2px 6px; border-radius: 99px; z-index: 2; }
.gb-screen .live i { width: 6px; height: 6px; border-radius: 50%; background: #3fdc7e; }
.gb-screen-l { text-align: center; font-size: 12px; color: var(--gb-muted); margin: 8px 0 12px; }
.gb-rhead { display: flex; justify-content: space-between; align-items: center; padding: 6px 2px 4px; color: var(--gb-muted); font-size: 13px; }
.gb-rt { display: flex; gap: 10px; padding: 8px 6px; border-radius: 10px; width: 100%; text-align: left; align-items: flex-start; }
.gb-rt:hover { background: var(--gb-hover); }
.gb-rt .ic { width: 16px; height: 16px; color: var(--gb-ok); margin-top: 2px; }
.gb-rt.off .ic { color: var(--gb-muted); }
.gb-rt b { display: block; font-weight: 500; font-size: 13.5px; }
.gb-rt span { color: var(--gb-muted); font-size: 12.5px; }
.gb-empty { color: var(--gb-muted); font-size: 12.5px; padding: 6px; }
.gb-field { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; }
.gb-field > span { font-size: 12px; color: var(--gb-muted); }
.gb-field input, .gb-field textarea { width: 100%; border: 1px solid var(--gb-line); background: var(--gb-card); border-radius: 8px; padding: 7px 9px; font-size: 13.5px; outline: 0; resize: vertical; line-height: 1.45; }
.gb-field input:focus, .gb-field textarea:focus { border-color: color-mix(in srgb, #1a7fff 60%, var(--gb-line)); box-shadow: 0 0 0 3px color-mix(in srgb, #1a7fff 15%, transparent); }
.gb-field textarea { min-height: 110px; }
.gb-box { border: 1px solid var(--gb-line); background: var(--gb-card); border-radius: 10px; padding: 4px 0; }
.gb-box > div, .gb-box > button { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 13.5px; width: 100%; text-align: left; }
.gb-box .add { color: var(--gb-muted); }
.gb-box .add:hover { color: var(--gb-text); }
.gb-box .ic { width: 15px; height: 15px; }
.gb-hist { display: flex; justify-content: space-between; align-items: center; padding: 6px 2px; font-size: 13px; }
.gb-hist .ic { width: 15px; height: 15px; color: var(--gb-ok); }
.gb-rtbar { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.gb-rtbar .sp { flex: 1; }
.gb-btn { height: 30px; padding: 0 12px; border-radius: 8px; background: color-mix(in srgb, var(--gb-text) 8%, transparent); font-size: 13.5px; font-weight: 500; }
.gb-btn:hover { background: color-mix(in srgb, var(--gb-text) 13%, transparent); }
.gb-btn.ink { background: var(--gb-ink); color: var(--gb-on-ink); }
.gb-sw { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; }
.gb-sw i { width: 30px; height: 18px; border-radius: 99px; background: var(--gb-line); position: relative; transition: background .15s; }
.gb-sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.gb-sw[aria-checked="true"] i { background: var(--gb-ink); }
.gb-sw[aria-checked="true"] i::after { transform: translateX(12px); }
.gb-avedit { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 8px 0 4px; }
.gb-swatches { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.gb-swatches button { width: 20px; height: 20px; border-radius: 50%; }
.gb-swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--gb-panel), 0 0 0 4px var(--gb-text); }
.gb-shapes { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.gb-shapes button { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; }
.gb-shapes button[aria-pressed="true"] { background: var(--gb-sel); }
.gb-note { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin-top: 14px; padding: 10px 11px; border-radius: 10px; background: color-mix(in srgb, var(--gb-text) 5%, transparent); }
.gb-note b { display: block; font-weight: 500; font-size: 13.5px; }
.gb-note span { font-size: 12.5px; color: var(--gb-muted); }

/* the bot's cloud computer */
.gb-comp { position: absolute; inset: 0; z-index: 40; background: rgba(18,18,18,.9); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; flex-direction: column; animation: fadein .18s; color: #e9e9e9; }
.gb-comp-top { height: 44px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; }
.gb-comp-top .who { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 13.5px; }
.gb-comp-top .who small { color: #9a9a9a; font-weight: 400; }
.gb-comp-top .grow { flex: 1; }
.gb-teach { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px 0 9px; border-radius: 999px; font-size: 13px; color: #f2f2f2; }
.gb-teach:hover { background: rgba(255,255,255,.1); }
.gb-teach .ic { width: 15px; height: 15px; }
.gb-teach.rec { background: #e5484d; color: #fff; }
.gb-comp .gb-iconbtn { color: #cfcfcf; }
.gb-comp .gb-iconbtn:hover { background: rgba(255,255,255,.1); color: #fff; }
.gb-desk { flex: 1; min-height: 0; margin: 0 28px 24px; border-radius: 6px; background: linear-gradient(180deg, #d9dbdf, #c7c9ce); position: relative; overflow: hidden; container-type: size; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
.gb-desk.rec { box-shadow: 0 0 0 3px #e5484d; }
.gb-desk .win { position: absolute; left: 6%; top: 4%; width: 70%; height: 82%; border-radius: 8px; overflow: hidden; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.25), 0 0 0 1px rgba(0,0,0,.12); display: flex; flex-direction: column; }
.gb-desk .win .mk { flex: 1; }
.gb-desk .win .mk * { --u: .6cqw; }
.gb-comp .gb-sheet { color: var(--gb-text); }
.gb-desk .term { position: absolute; right: 4%; top: 9%; width: 30%; height: 54%; border-radius: 8px; background: #121212; box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 1.4cqh 1.4cqw; font: 1.6cqh/1.5 var(--font-mono); color: #7ee2a8; overflow: hidden; }
.gb-desk .term span { color: #8a8a8a; display: block; }
.gb-desk .ddock { position: absolute; left: 50%; bottom: 1.6cqh; transform: translateX(-50%); display: flex; gap: 1.2cqh; padding: .9cqh 1.2cqh; border-radius: 1.6cqh; background: rgba(255,255,255,.45); box-shadow: inset 0 0 0 1px rgba(255,255,255,.6); }
.gb-desk .ddock b { width: 5.4cqh; height: 5.4cqh; border-radius: 1.3cqh; display: grid; place-items: center; }
.gb-desk .ddock .ic { width: 3cqh; height: 3cqh; }
.gb-cursor { position: absolute; width: 3.4cqh; height: 3.4cqh; z-index: 4; left: 40%; top: 45%; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); transition: left .7s cubic-bezier(.3,.7,.2,1), top .7s cubic-bezier(.3,.7,.2,1); pointer-events: none; }
.gb-click { position: absolute; width: 4cqh; height: 4cqh; margin: -2cqh 0 0 -2cqh; border-radius: 50%; border: 2px solid #e5484d; animation: ring .6s ease-out forwards; pointer-events: none; z-index: 5; }
.gb-steps { position: absolute; right: 16px; bottom: 16px; width: min(300px, 46%); background: rgba(20,20,20,.88); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; color: #eee; z-index: 6; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.gb-steps b { display: flex; align-items: center; gap: 7px; font-weight: 600; margin-bottom: 6px; }
.gb-steps b i { width: 8px; height: 8px; border-radius: 50%; background: #e5484d; animation: dt-shimmer 1s infinite; }
.gb-steps ol { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.gb-steps p { margin: 0; color: #aaa; }
.gb-comp-hint { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: rgba(0,0,0,.72); color: #fff; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; z-index: 6; white-space: nowrap; }

/* mock pages shown on bot screens (scaled with container units) */
.mk { --u: 1cqw; container-type: inline-size; background: #fff; color: #222; display: flex; flex-direction: column; overflow: hidden; text-align: left; }
.mk-bar { flex: none; height: calc(6.5 * var(--u)); display: flex; align-items: center; gap: calc(1.4 * var(--u)); padding: 0 calc(2 * var(--u)); background: #eef0f3; border-bottom: calc(.25 * var(--u)) solid #e1e3e7; font-size: calc(2.3 * var(--u)); color: #555; }
.mk-bar i { width: calc(1.6 * var(--u)); height: calc(1.6 * var(--u)); border-radius: 50%; background: #c9ccd2; }
.mk-bar .u { flex: 1; height: calc(4 * var(--u)); border-radius: 99px; background: #fff; display: flex; align-items: center; padding: 0 calc(2 * var(--u)); white-space: nowrap; overflow: hidden; }
.mk-b { flex: 1; min-height: 0; display: flex; gap: calc(2.4 * var(--u)); padding: calc(2.6 * var(--u)); font-size: calc(2.3 * var(--u)); }
.mk-nav { width: 18%; display: flex; flex-direction: column; gap: calc(1.6 * var(--u)); }
.mk-nav i { height: calc(1.6 * var(--u)); border-radius: calc(1 * var(--u)); background: #e8eaee; }
.mk-nav i:first-child { background: #1f2937; width: 70%; height: calc(2.2 * var(--u)); }
.mk-c { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(1.6 * var(--u)); }
.mk-h { font-weight: 700; font-size: calc(3.2 * var(--u)); }
.mk-item { display: flex; align-items: center; gap: calc(1.8 * var(--u)); padding-bottom: calc(1.4 * var(--u)); border-bottom: calc(.2 * var(--u)) solid #eee; }
.mk-item .th { width: calc(7 * var(--u)); height: calc(7 * var(--u)); border-radius: calc(1 * var(--u)); flex: none; }
.mk-item .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mk-item .pr { font-weight: 600; }
.mk-sum { width: 28%; border: calc(.2 * var(--u)) solid #e6e6e6; border-radius: calc(1.6 * var(--u)); padding: calc(2 * var(--u)); display: flex; flex-direction: column; gap: calc(1.4 * var(--u)); align-self: flex-start; }
.mk-sum .go { background: #1e9b4a; color: #fff; border-radius: calc(1 * var(--u)); text-align: center; padding: calc(1.4 * var(--u)); font-weight: 600; }
.mk-sum .go.y { background: #f6c84c; color: #222; }
.mk-mail .mk-item { gap: calc(2 * var(--u)); }
.mk-mail .dot { width: calc(1.6 * var(--u)); height: calc(1.6 * var(--u)); border-radius: 50%; background: #1a7fff; flex: none; }
.mk-mail .dot.r { background: transparent; }
.mk-mail .from { width: 24%; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mk-code { background: #16181d; color: #c9d1d9; font-family: var(--font-mono); }
.mk-code .mk-bar { background: #1f2229; border-color: #2a2e36; color: #9aa4b2; }
.mk-code .mk-bar .u { background: #2a2e36; color: #c9d1d9; }
.mk-code .ln { display: flex; gap: calc(2 * var(--u)); white-space: pre; font-size: calc(2.2 * var(--u)); line-height: 1.55; }
.mk-code .ln em { color: #5c6370; font-style: normal; width: calc(3 * var(--u)); text-align: right; flex: none; }
.mk-code .k { color: #c678dd; } .mk-code .s { color: #98c379; } .mk-code .f { color: #61afef; }
.mk-deck .slides { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: calc(2 * var(--u)); }
.mk-deck .sl { aspect-ratio: 16 / 9; border-radius: calc(1 * var(--u)); background: #f3f4f6; border: calc(.2 * var(--u)) solid #e5e7eb; padding: calc(1.4 * var(--u)); display: flex; flex-direction: column; gap: calc(1 * var(--u)); }
.mk-deck .sl i { height: calc(1.2 * var(--u)); border-radius: calc(.6 * var(--u)); background: #d1d5db; }
.mk-deck .sl i:first-child { width: 60%; background: #111827; }
.mk-deck .sl.on { border-color: #f4b400; box-shadow: 0 0 0 calc(.4 * var(--u)) #fde7a6; }
.mk-deck .bars { flex: 1; display: flex; align-items: flex-end; gap: calc(.8 * var(--u)); }
.mk-deck .bars b { flex: 1; background: #6366f1; border-radius: calc(.4 * var(--u)) calc(.4 * var(--u)) 0 0; }
.mk-tbl { display: grid; grid-template-columns: 2fr 1.4fr 1fr 1fr; gap: 0; font-size: calc(2.1 * var(--u)); }
.mk-tbl > * { padding: calc(1.2 * var(--u)) calc(1 * var(--u)); border-bottom: calc(.2 * var(--u)) solid #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mk-tbl .th { color: #888; font-weight: 600; }
.mk-pill { display: inline-block; padding: calc(.2 * var(--u)) calc(1.2 * var(--u)); border-radius: 99px; font-size: calc(1.9 * var(--u)); background: #e8f5ee; color: #1e8a4c; }
.mk-pill.w { background: #fff4dd; color: #a86b00; }
.mk-listing { display: grid; grid-template-columns: 1.2fr 1fr; gap: calc(2.4 * var(--u)); }
.mk-listing .ph { border-radius: calc(1.4 * var(--u)); background: linear-gradient(135deg, #cbb89d, #8e7a5f); aspect-ratio: 4 / 3; position: relative; }
.mk-listing .ph::after { content: ""; position: absolute; left: 20%; right: 20%; top: 35%; height: 8%; background: #4a3b2a; border-radius: calc(.6 * var(--u)); box-shadow: 0 calc(6 * var(--u)) 0 calc(-1 * var(--u)) #4a3b2a; }

    if (D.menu && !e.target.closest('.dt-menu, .dt-cardmore')) { D.menu = null; dtCard(); }
    if (e.target.closest('[data-act="dt-sheet-close"]')) { $('#dt-sheet').innerHTML = ''; return; }
    const a = e.target.closest('a[data-link]');
    if (a) { e.preventDefault(); if (a.dataset.link === '#doc') openPane('doc'); else toast('Links in this rebuild are placeholders.'); return; }
    dotsClick(e);
  });
  app.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('slide')) { e.preventDefault(); openPane('doc'); } if (e.key === 'Escape') { if (D.modal) { D.modal = null; dtModal(); dtCallPill(); } closeDrawer(); } });
  const input = $('#dt-input'), send = $('#dt-send');
  input.addEventListener('input', () => { send.disabled = !input.value.trim(); });
  $('#dt-form').addEventListener('submit', e => { e.preventDefault(); const v = input.value; input.value = ''; send.disabled = true; dtSend(v); });
  app.addEventListener('input', e => { if (e.target.id === 'dt-name' && D.draft) D.draft.name = e.target.value; });
  matchMedia('(max-width: 760px)').addEventListener('change', () => { dtPane(); dtCard(); });
  matchMedia('(max-width: 1080px)').addEventListener('change', e => { D.card = !e.matches; dtCard(); });
}

function botAv(b, size) {
  const s = BOT_SHAPES[b.shape] || BOT_SHAPES.circle;
  const [cx, cy, gap] = s.eye;
  const t = b.tilt || 0;
  let eyes;
  if (b.eyes === 'dash') eyes = `<rect x="${cx - gap / 2 - 7.5}" y="${cy - 3.5}" width="15" height="7" rx="3.5"/><rect x="${cx + gap / 2 - 7.5}" y="${cy - 3.5}" width="15" height="7" rx="3.5" transform="rotate(12 ${cx + gap / 2} ${cy})"/>`;

  else eyes = `<rect x="${cx - gap / 2 - 3.8}" y="${cy - 8}" width="7.6" height="16" rx="3.8" transform="rotate(${t} ${cx - gap / 2} ${cy})"/><rect x="${cx + gap / 2 - 3.8}" y="${cy - 7}" width="7.6" height="16" rx="3.8" transform="rotate(${t} ${cx + gap / 2} ${cy})"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true" style="flex:none"><g fill="${b.color}">${s.d}</g><g fill="#fff">${eyes}</g></svg>`;
}

async function gbSay(b, items) {
  for (const it of [].concat(items)) {
    const ty = { t: 'typing' };
    b.msgs.push(ty); if (b.id === G.open) gbMsgs();
    await sleep(Math.min(1400, 450 + (typeof it === 'string' ? it.length * 8 : 300)));
    const k = b.msgs.indexOf(ty); if (k > -1) b.msgs.splice(k, 1);
    b.msgs.push(typeof it === 'string' ? { t: 'bot', text: it } : it);
    b.time = clock();
    if (b.id === G.open) gbMsgs(); else b.unread = true;
    gbSide();
  }
}
async function gbRespond(b, text) {
  const q = text.toLowerCase();
  await sleep(350);

    if (!b.members.length) { b.msgs.push({ t: 'sys', text: 'No Bots here yet. Add one from Members to get a reply.' }); gbMsgs(); return; }
    const order = b.members.slice(0, 2);
    const lines = [`On it. I'll take the first pass and post here.`, `I can cover the rest once that's done. Tagging myself on the follow-up.`];
    for (let k = 0; k < order.length; k++) await gbSay(b, { t: 'bot', from: order[k], text: lines[k] });
    return;
  }
  if (/screen|computer|watch/.test(q)) { await gbSay(b, 'Opening my screen. Use Teach a task if you want to show me how you do something.'); G.comp = true; gbComp(); return; }
  if (/every|daily|weekly|routine|each (day|morning|week)|schedule/.test(q)) {
    const day = (q.match(/monday|tuesday|wednesday|thursday|friday|saturday|sunday|weekday|day/) || ['weekday'])[0];
    const when = day === 'day' ? 'Every day at 9:00 AM' : day === 'weekday' ? 'Weekdays at 9:00 AM' : `Every ${day[0].toUpperCase() + day.slice(1)} at 9:00 AM`;
    const name = titleCase(text.replace(/\b(every|each|daily|weekly|on|at|please|can you|could you)\b.*$/i, '').trim() || text);
    b.routines.unshift({ name, when: [when], on: true, instruction: text, history: [] });
    b.msgs.push({ t: 'sys', text: `Created routine · ${name}` }); gbMsgs();
    await gbSay(b, `Added a routine: "${name}", ${when.toLowerCase()}. It's in the panel on the right if you want to change the instructions.`);
    gbPanel(); return;
  }
  if (b.id === 'grocery' && /check ?out|go ahead|buy|order/.test(q)) {
    await gbSay(b, [{ t: 'approve', label: 'Costco order', to: '$142.18 · same-day delivery', body: 'Eggs, oats, chicken thighs, olive oil, sparkling water + 1 more\nDelivery today 5–6 PM', yes: 'Place order', no: 'Not yet', state: null, done: ['Ordered. Delivery today between 5 and 6 PM.', 'Okay, still holding.'] }]);
    return;
  }
  // default: start a job on the bot's computer
  await gbSay(b, 'On it. Working on it from my computer; I\'ll post here when it\'s done.');
  const task = { t: 'task', title: titleCase(text), status: 'running' };
  b.msgs.push(task); b.working = true; b.awake = true;
  if (b.id === G.open) { gbMsgs(); gbPanel(); } gbSide();
  await sleep(4600);
  task.status = 'done'; b.working = false;
  if (b.id === G.open) { gbMsgs(); gbPanel(); }
  await gbSay(b, `Done. ${task.title}: I left the details in a doc and linked it here. Anything you want changed?`);
  if (G.comp) gbComp();
}

    }
    case 'gb-choose': {
      const m = b.msgs[+t.dataset.i]; const o = +t.dataset.o; m.picked = o; gbMsgs(false); gbSide();
      if (o >= 0) {
        if (m.routine && o < 2) b.routines.unshift({ name: `${b.name} run`, when: [o === 0 ? 'Weekdays at 9:00 AM' : 'Every Monday at 9:00 AM'], on: true, instruction: b.desc, history: [] });
        gbPanel();
        gbSay(b, m.replies ? m.replies[o] : `Going with "${m.opts[o]}".`);
      }
      break;
    }
    case 'gb-approve': {
      const m = b.msgs[+t.dataset.i]; m.state = t.dataset.v; gbMsgs(false); gbSide();
      gbSay(b, m.done[m.state === 'yes' ? 0 : 1]); break;
    }
    case 'gb-rt': G.rt = +t.dataset.k; G.panel = 'routine'; gbPanel(); break;
    case 'gb-rt-new': b.routines.push({ name: 'New routine', when: ['Weekdays at 9:00 AM'], on: true, instruction: '', history: [] }); G.rt = b.routines.length - 1; G.panel = 'routine'; gbPanel(); setTimeout(() => $('#gb-r-name')?.select(), 30); break;
    case 'gb-rt-on': { const r = b.routines[G.rt]; r.on = !r.on; gbPanel(); break; }
    case 'gb-rt-del': b.routines.splice(G.rt, 1); G.panel = 'main'; gbPanel(); toast('Routine deleted.'); break;
    case 'gb-rt-test': { const r = b.routines[G.rt]; r.history.unshift('Just now'); gbPanel(); gbSay(b, `Test run of "${r.name}" finished. ${r.instruction ? 'Followed the instructions; nothing was sent without approval.' : 'There are no instructions yet, so I only checked I can reach your tools.'}`); break; }
    case 'gb-rt-when-add': { const r = b.routines[G.rt]; r.when.push(['Every day at 5:00 PM', 'Every Sunday at 6:00 PM', 'First of the month at 8:00 AM'][r.when.length % 3]); gbPanel(); break; }
    case 'gb-rt-when-del': { const r = b.routines[G.rt]; r.when.splice(+t.dataset.k, 1); if (!r.when.length) r.when.push('Only when asked'); gbPanel(); break; }
    case 'gb-color': b.color = t.dataset.c; gbRender(); break;
    case 'gb-shape': b.shape = t.dataset.s; gbRender(); break;
    case 'gb-notify': b.notify = b.notify === false; gbPanel(); break;
    case 'gb-hide': b.hidden = !b.hidden; gbRender(); toast(b.hidden ? `${b.name} moved to Hidden Bots.` : `${b.name} is back in the list.`); break;
    case 'gb-pin': b.group = b.group === 'pinned' ? (b.prevGroup || 'Unassigned') : (b.prevGroup = b.group, 'pinned'); gbRender(); break;
  }
}
function mountGrok() {
  G.panelOpen = !matchMedia('(max-width: 1100px)').matches;
  $('#app-grok').innerHTML = gbShellHTML();
  gbRender();
  $('#mark-grok').innerHTML = botAv({ shape: 'squircle', color: '#ff9500' }, 20);
  const root = $('#grok');
  root.addEventListener('click', gbClick);
  root.addEventListener('contextmenu', e => {
    const row = e.target.closest('.gb-row, .gb-pin');
    if (!row || matchMedia('(max-width: 760px)').matches) return;
    e.preventDefault();
    const r = root.getBoundingClientRect();
    G.ctx = { id: row.dataset.id, x: e.clientX - r.left, y: e.clientY - r.top }; gbCtx();
  });
  root.addEventListener('input', e => { if (e.target.id === 'gb-plug-q') { G.plugQ = e.target.value; const pos = e.target.selectionStart; gbModal(); const q = $('#gb-plug-q'); q.focus(); q.setSelectionRange(pos, pos); } });
  root.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.gb-screen')) { e.preventDefault(); G.comp = true; gbComp(); }
    if (e.key === 'Escape') { if (G.ctx || G.plus || G.profile) { G.ctx = null; G.plus = false; G.profile = false; gbCtx(); gbPlusMenu(); gbHead(); return; } if (G.modal) { G.modal = null; gbModal(); } else if (G.comp) { G.comp = false; G.teach = null; G.learned = null; gbComp(); } }
  });
  $('#gb-list').addEventListener('scroll', gbUnreadPill);
  $('#gb-search').addEventListener('input', e => { G.search = e.target.value; gbSide(); });
  const input = $('#gb-input'), mic = $('#gb-mic');
  input.addEventListener('input', () => { mic.innerHTML = icon(input.value.trim() ? 'up' : 'mic'); mic.title = input.value.trim() ? 'Send' : 'Dictate'; });
  $('#gb-form').addEventListener('submit', e => { e.preventDefault(); if (!input.value.trim()) { toast('Dictation isn\'t part of this rebuild.'); return; } const v = input.value; input.value = ''; mic.innerHTML = icon('mic'); gbSend(v); });
  root.addEventListener('input', e => {
    const b = gbCur();
    if (e.target.id === 'gb-f-name') { const old = b.name; b.name = e.target.value || old; gbSide(); gbHead(); b._renamedFrom = b._renamedFrom || old; }
    if (e.target.id === 'gb-f-title') { b.title = e.target.value; gbSide(); }
    if (e.target.id === 'gb-f-desc') b.desc = e.target.value;
    if (e.target.id === 'gb-r-name') { b.routines[G.rt].name = e.target.value; }
    if (e.target.id === 'gb-r-ins') { b.routines[G.rt].instruction = e.target.value; }
  });
  root.addEventListener('change', e => {
    const b = gbCur();
    if (e.target.id === 'gb-f-name' && b._renamedFrom && b._renamedFrom !== b.name) { b.msgs.push({ t: 'sys', text: `Renamed to ${b.name}` }); delete b._renamedFrom; gbMsgs(); }
  });
  matchMedia('(max-width: 760px)').addEventListener('change', e => { if (!e.matches) G.mChat = false; gbRender(); });
  const mid = matchMedia('(max-width: 1100px)');
  mid.addEventListener('change', e => { G.panelOpen = !e.matches; gbPanel(); gbHead(); });
}

/* ═════════ shell ═════════ */
const SH = { app: 'dots', theme: 'system' };
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function setApp(app) {
  SH.app = app; store('gbd-app', app);
  $$('.sh-seg button').forEach(b => b.setAttribute('aria-selected', b.dataset.app === app));
  $('#app-dots').hidden = app !== 'dots';
  $('#app-grok').hidden = app !== 'grok';
  renderNotes();
}
function setTheme(t) {
  SH.theme = t; store('gbd-theme', t);
  if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  $('#theme-lbl').textContent = t[0].toUpperCase() + t.slice(1);
}
function renderNotes() { $('#notes-body').innerHTML = (window.NOTES && NOTES[SH.app]) || ''; $('#notes-title').textContent = SH.app === 'dots' ? 'Field notes · OpenAI Dots' : 'Field notes · Grok Bot'; }
function toggleNotes(on) {
  const n = $('#notes'); const open = on ?? !n.classList.contains('on');
  n.classList.toggle('on', open); n.setAttribute('aria-hidden', !open); $('#btn-notes').setAttribute('aria-expanded', open);
}
$$('.sh-seg button').forEach(b => b.addEventListener('click', () => setApp(b.dataset.app)));
$('#btn-notes').addEventListener('click', () => toggleNotes());
$('#notes-close').addEventListener('click', () => toggleNotes(false));
$('#btn-theme').addEventListener('click', () => setTheme({ system: 'light', light: 'dark', dark: 'system' }[SH.theme]));

mountDots();
mountGrok();
setTheme(store('gbd-theme') || 'system');
setApp(store('gbd-app') || 'dots');
